<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">CF</div>

    <div class="brand-text">
      <span class="brand-name">CFHOP</span>
      <span class="brand-sub">Admin Console</span>
    </div>
  </div>

  <nav class="nav">

    <div class="nav-group" *ngFor="let group of groups">

      <p class="group-label">{{ group.label }}</p>

      <ng-container *ngFor="let item of group.items">

        <a
          *ngIf="!item.children"
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
        >

          <span class="nav-icon">

            <svg *ngIf="item.icon === 'home'" viewBox="0 0 24 24" fill="none">
              <path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5.5 10v9a1 1 0 0 0 1 1H10v-5a2 2 0 0 1 4 0v5h3.5a1 1 0 0 0 1-1v-9"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'users'" viewBox="0 0 24 24" fill="none">
              <circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M2.8 19c.6-3.6 3-5.6 6.2-5.6s5.6 2 6.2 5.6"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M15.5 8.2a3 3 0 1 1 2.6 4.5"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'wallet'" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="6" width="18" height="13" rx="2.2"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="16.5" cy="14" r="1.1" fill="currentColor"/>
            </svg>

            <svg *ngIf="item.icon === 'swap'" viewBox="0 0 24 24" fill="none">
              <path d="M4 8h13l-3.2-3.2"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M20 16H7l3.2 3.2"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'savings'" viewBox="0 0 24 24" fill="none">
              <path d="M4 10h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8Z"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M7 10V7a5 5 0 0 1 10 0v3"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M9 15h6"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>

            <svg *ngIf="item.icon === 'heart'" viewBox="0 0 24 24" fill="none">
              <path d="M12 20s-7.2-4.4-9.6-9A5.4 5.4 0 0 1 12 6.2 5.4 5.4 0 0 1 21.6 11c-2.4 4.6-9.6 9-9.6 9Z"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'shield'" viewBox="0 0 24 24" fill="none">
              <path d="M12 3.5 19 6v6c0 4.4-2.9 7.6-7 8.5-4.1-.9-7-4.1-7-8.5V6l7-2.5Z"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="m9 12 2 2 4-4"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'clinic'" viewBox="0 0 24 24" fill="none">
              <path d="M4 20V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M9 8v6M6 11h6"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M3 20h18"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'alert'" viewBox="0 0 24 24" fill="none">
              <path d="M10.6 4.6 2.9 18a1.6 1.6 0 0 0 1.4 2.4h15.4a1.6 1.6 0 0 0 1.4-2.4L13.4 4.6a1.6 1.6 0 0 0-2.8 0Z"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 10v4"
                stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="17" r="0.9" fill="currentColor"/>
            </svg>

            <svg *ngIf="item.icon === 'bell'" viewBox="0 0 24 24" fill="none">
              <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M10 21h4"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'chart'" viewBox="0 0 24 24" fill="none">
              <path d="M4 20V10M10 20V4M16 20v-7M20 20H4"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <svg *ngIf="item.icon === 'gear'" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9"
                stroke="currentColor" stroke-width="1.8"/>
              <path d="M4.6 10.5a1.7 1.7 0 0 0-.3-1.9"
                stroke="currentColor" stroke-width="1.8"/>
            </svg>

          </span>

          <span class="nav-label">{{ item.label }}</span>

          <span class="nav-badge" *ngIf="item.badge">
            {{ item.badge }}
          </span>

        </a>

      </ng-container>

    </div>

  </nav>

  <div class="sidebar-footer">
    <span class="version">v2.4.1 &middot; build 20260922</span>
  </div>
</aside>
