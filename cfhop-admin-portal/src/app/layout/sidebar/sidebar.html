<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">CF</div>
    <div class="brand-text">
      <span class="brand-name">CFHOP</span>
      <span class="brand-sub">Admin Console</span>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-group" *ngFor="let group of groups">
      <p class="group-label">{{ group.label }}</p>

      <ng-container *ngFor="let item of group.items">
        <!-- Plain link item -->
        <a
          *ngIf="!item.children"
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          <span class="nav-icon" [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'home'" viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10a.5.5 0 0 0 .5-.5V15a1.5 1.5 0 0 1 3 0v4.5a.5.5 0 0 0 .5.5h3.5a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg *ngSwitchCase="'wallet'" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="14" r="1.1" fill="currentColor"/></svg>
            <svg *ngSwitchCase="'group'" viewBox="0 0 24 24" fill="none"><circle cx="8.5" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c.5-3.2 2.7-5 5.5-5s5 1.8 5.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14.8 14.3c2.3.2 4 1.8 4.4 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg *ngSwitchCase="'heart'" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7.2-4.4-9.6-9A5.4 5.4 0 0 1 12 6.2 5.4 5.4 0 0 1 21.6 11c-2.4 4.6-9.6 9-9.6 9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <svg *ngSwitchCase="'shield'" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 19 6v6c0 4.4-2.9 7.6-7 8.5-4.1-.9-7-4.1-7-8.5V6l7-2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg *ngSwitchCase="'star'" viewBox="0 0 24 24" fill="none"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.8l-5.2 2.9 1-5.9-4.3-4.1 5.9-.8L12 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <svg *ngSwitchCase="'briefcase'" viewBox="0 0 24 24" fill="none"><rect x="3" y="7.5" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 12.5h18" stroke="currentColor" stroke-width="1.8"/></svg>
            <svg *ngSwitchCase="'alert'" viewBox="0 0 24 24" fill="none"><path d="M10.6 4.6 2.9 18a1.6 1.6 0 0 0 1.4 2.4h15.4a1.6 1.6 0 0 0 1.4-2.4L13.4 4.6a1.6 1.6 0 0 0-2.8 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="0.9" fill="currentColor"/></svg>
            <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M20 20H4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg *ngSwitchCase="'gear'" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.6 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </span>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
        </a>

        <!-- Dropdown item -->
        <div *ngIf="item.children" class="nav-dropdown">
          <button
            type="button"
            class="nav-item nav-item--toggle"
            [class.open]="isOpen(item.label)"
            (click)="toggle(item.label)"
          >
            <span class="nav-icon" [ngSwitch]="item.icon">
              <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M2.8 19c.6-3.6 3-5.6 6.2-5.6s5.6 2 6.2 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 8.2a3 3 0 1 1 2.6 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17.3 13.6c2.1.5 3.6 2.2 4 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <svg *ngSwitchCase="'swap'" viewBox="0 0 24 24" fill="none"><path d="M4 8h13l-3.2-3.2M20 16H7l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="nav-label">{{ item.label }}</span>
            <svg class="chevron" [class.open]="isOpen(item.label)" viewBox="0 0 24 24" fill="none">
              <path d="m8 10 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="nav-submenu" *ngIf="isOpen(item.label)">
            <a
              class="nav-subitem"
              *ngFor="let child of item.children"
              [routerLink]="child.route"
              routerLinkActive="active"
            >
              {{ child.label }}
            </a>
          </div>
        </div>
      </ng-container>
    </div>
  </nav>

  <div class="sidebar-footer">
    <span class="version">v2.4.1 &middot; build 20260922</span>
  </div>
</aside>
