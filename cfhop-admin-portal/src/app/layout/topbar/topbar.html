<header class="topbar">
  <div class="topbar-title">
    <span class="eyebrow">{{ eyebrow }}</span>
    <h1>{{ title }}</h1>
  </div>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="m20 20-3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <input
      type="text"
      [placeholder]="searchPlaceholder"
      (input)="onSearch($any($event.target).value)"
    />
  </label>

  <div class="topbar-actions">
    <span class="date">{{ today | date: 'EEEE, d MMMM y' }}</span>

    <button type="button" class="icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="icon-badge" *ngIf="notificationCount">{{ notificationCount }}</span>
    </button>

    <span class="role-pill">{{ roleLabel }}</span>

    <div class="user-chip">
      <div class="avatar">{{ userInitials }}</div>
      <div class="user-meta">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
    </div>
  </div>
</header>
